[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-forge"
version = "0.1.0"
description = "A shareable, cross-platform workshop for building tiny language models from scratch."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LLM Forge contributors" }]
dependencies = [
    "torch>=2.2",
    "tokenizers>=0.15",
    "safetensors>=0.4",
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
llm-forge = "llmforge.cli:main"

[tool.setuptools.packages.find]
include = ["llmforge*"]
